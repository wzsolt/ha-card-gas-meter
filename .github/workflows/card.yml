name: Gas Meter Card

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: gas-meter-card
          path: dist/ha-card-gas-meter.js
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: gas-meter-card
          path: dist
      - name: Publish and verify the Dashboard module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          filename="$(node -p "require('./hacs.json').filename")"
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "dist/$filename"

          notes="$(mktemp)"
          awk -v heading="## [$version]" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! awk 'NF { found = 1 } END { exit !found }' "$notes"; then
            echo "::error::Add a nonempty ## [$version] section to CHANGELOG.md before tagging."
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json; then
            if ! jq -e --arg filename "$filename" 'any(.assets[]; .name == $filename)' release-assets.json > /dev/null; then
              gh release upload "$GITHUB_REF_NAME" "dist/$filename"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "dist/$filename" --verify-tag --notes-file "$notes"
          fi

          verified="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --pattern "$filename" --dir "$verified"
          cmp "dist/$filename" "$verified/$filename"

  validate-hacs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          comment: "false"
          ignore: images
